name: 데이터 업데이트

on:
  schedule:
    # 기상청 단기예보 발표(05시, 17시) 직후. cron은 UTC 기준 → 한국시간 05:40, 17:40
    - cron: "40 20 * * *"
    - cron: "40 8 * * *"
  workflow_dispatch: {}   # Actions 탭에서 'Run workflow'로 바로 실행 가능

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 공공데이터 수집 및 점수 계산
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          FISHING_URL: ${{ vars.FISHING_URL }}
          FISHING_PARAMS: ${{ vars.FISHING_PARAMS }}
          FISHING_FIELDS: ${{ vars.FISHING_FIELDS }}
        run: python scripts/collect.py

      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data samples || true
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "데이터 업데이트 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git push
          fi
